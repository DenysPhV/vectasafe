version: '3.8'

services:
  api:
    build: ./src
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    env_file:
      - .env  # Тут буде ваш шлях до GCP
    depends_on:
      - redis
      # db прибрали, бо він тепер зовнішній

  worker:
    build: ./src
    command: arq worker.WorkerSettings
    volumes:
      - ./src:/app
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant

  # Redis (Cache & Queue) залишаємо локально або теж можна винести в GCP MemoryStore
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    
  # Qdrant (Vector DB) залишаємо контейнером (або можна використати Qdrant Cloud)
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: